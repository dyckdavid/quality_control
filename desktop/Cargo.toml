[package]
name = "qc-desktop"
version = "0.1.0"
edition = "2021"
description = "Native quality-control desktop client (egui/eframe) for macOS, Windows, and Linux"
license = "MIT"
readme = "README.md"

[dependencies]
eframe = { version = "0.29", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["datepicker"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }
poll-promise = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
csv = "1.3"
directories = "5"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
rfd = "0.15"
qrcode = { version = "0.14", default-features = false }
ab_glyph = "0.2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
serde_json = "1"

[[bin]]
name = "qc-desktop"
path = "src/main.rs"

[lib]
name = "qc_desktop"
path = "src/lib.rs"
