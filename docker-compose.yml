# Local stack. The published port is bound to this machine only.
# Change POSTGRES_PASSWORD, QC_JWT_SECRET, and QC_ADMIN_PASSWORD before use.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: qc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qc-local-password}
      POSTGRES_DB: quality_control
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qc -d quality_control"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      QC_HTTP_ADDR: ":8080"
      QC_DATABASE_URL: postgres://qc:${POSTGRES_PASSWORD:-qc-local-password}@postgres:5432/quality_control?sslmode=disable
      QC_JWT_SECRET: ${QC_JWT_SECRET:-replace-with-openssl-rand-base64-48-characters}
      QC_ADMIN_USERNAME: ${QC_ADMIN_USERNAME:-admin}
      QC_ADMIN_PASSWORD: ${QC_ADMIN_PASSWORD:-change-me-now}
      QC_ADMIN_EMAIL: ${QC_ADMIN_EMAIL:-admin@localhost}
      QC_ADMIN_FULL_NAME: Administrator
      QC_DATA_DIR: /data
    ports:
      - "8080:8080"
    volumes:
      - qcdata:/data

volumes:
  pgdata:
  qcdata:
